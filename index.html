  { id: 'postanowicz', name: 'Patty Postanowicz',       cred: 'PhD, LMFT', specialty: 'Family Therapy',            avatar: 'PP', color: 'oklch(58% 0.13 290)', bg: 'oklch(96% 0.03 290)',  text: 'oklch(28% 0.12 290)' },
];
const SCHED_APPT_COLORS = {
  immigration_medical_exam: { bg:'oklch(97% 0.04 55)', border:'oklch(60% 0.15 55)', text:'oklch(28% 0.12 55)', label:'Immigration Exam' },
  primary_care:             { bg:'var(--teal-soft)',   border:'var(--teal)',         text:'var(--teal-deep)',   label:'Primary Care'    },
  pre_placement:            { bg:'var(--sage-soft)',   border:'var(--sage)',         text:'oklch(33% 0.09 200)',label:'Pre-Placement'   },
  annual_physical:          { bg:'oklch(96% 0.04 285)',border:'oklch(58% 0.14 285)',text:'oklch(28% 0.12 285)',label:'Physical'        },
};
function schedGetMonday(date) {
  const d = new Date(date); const day = d.getDay();
  d.setDate(d.getDate() - day + (day === 0 ? -6 : 1));
  d.setHours(0,0,0,0); return d;
}
function schedFakeTime(id, date) {
  const h = id.split('').reduce((a,c) => (a * 31 + c.charCodeAt(0)) & 0xFFFFFF, 0);
  const hour = 8 + (h % 9); const min = (h & 1) * 30;
  const d = new Date(date); d.setHours(hour, min, 0, 0); return d;
}
function schedAssignProvider(appt) {
  if (appt.provider_name) {
    // Exact name match first
    const exact = SCHED_PROVIDERS.find(p => appt.provider_name.toLowerCase().includes(p.name.toLowerCase().split(' ')[2]));
    if (exact) return exact.id;
    // Partial last-name match
    const partial = SCHED_PROVIDERS.find(p => appt.provider_name.toLowerCase().includes(p.name.toLowerCase().split(' ').pop()));
    if (partial) return partial.id;
  }
  // No match or unassigned: distribute by appointment type then ID hash
  const t = (appt.appointment_type || '').toLowerCase();
  if (t.includes('immigration')) return 'desai';
  if (t.includes('pre_placement') || t.includes('placement')) return 'kapoor';
  const h = (appt.id||'').split('').reduce((a,c)=>(a*31+c.charCodeAt(0))&0xFFFFFF,0);
  return SCHED_PROVIDERS[h % SCHED_PROVIDERS.length].id;
}

function SchedulesView({ onBack, onHome }) {
  const [selProv, setSelProv]   = React.useState(SCHED_PROVIDERS[0]);
  const [weekStart, setWeekStart] = React.useState(() => schedGetMonday(new Date()));
  const [appointments, setAppointments] = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [syncState, setSyncState] = React.useState('syncing'); // 'syncing'|'synced'|'idle'
  const [lastSync, setLastSync] = React.useState(null);
  const nowRef = React.useRef(new Date());

  React.useEffect(() => {
    setSyncState('syncing');
    const t = setTimeout(() => {
      apiGet('/appointments/upcoming')
        .then(d => { setAppointments(d); setLastSync(new Date()); setSyncState('synced'); })
        .catch(() => setSyncState('idle'))
        .finally(() => setLoading(false));
    }, 1800);
    return () => clearTimeout(t);
  }, []);

  function handleProviderChange(p) {
    if (p.id === selProv.id) return;
    setSelProv(p);
    setSyncState('syncing');
    setTimeout(() => { setSyncState('synced'); setLastSync(new Date()); }, 900);
  }

  const HOUR_START = 8, HOUR_END = 18, HOUR_H = 64;
  const GRID_H = (HOUR_END - HOUR_START) * HOUR_H;
  const hours = Array.from({length: HOUR_END - HOUR_START + 1}, (_, i) => HOUR_START + i);

  const weekDays = Array.from({length:7}, (_,i) => {
    const d = new Date(weekStart); d.setDate(weekStart.getDate() + i); return d;
  });

  const provAppts = appointments
    .filter(a => schedAssignProvider(a) === selProv.id)
    .map(a => {
      let dt = null;
      if (a.appointment_date) {
        const base = new Date(a.appointment_date);
        dt = (base.getHours() === 0 && base.getMinutes() === 0) ? schedFakeTime(a.id, base) : base;
      }
      return { ...a, _dt: dt };
    });

  const unscheduled = provAppts.filter(a => a._dt === null);
  const apptsByDay  = {};
  for (const a of provAppts.filter(x => x._dt)) {
    const k = a._dt.toDateString();
    (apptsByDay[k] = apptsByDay[k] || []).push(a);
  }

  const today = new Date(); today.setHours(0,0,0,0);
  function timeToY(dt) {
    return Math.max(0, (dt.getHours() - HOUR_START + dt.getMinutes()/60) * HOUR_H);
  }
  const nowY = (() => {
    const n = nowRef.current;
    const y = (n.getHours() - HOUR_START + n.getMinutes()/60) * HOUR_H;
    return (y >= 0 && y <= GRID_H) ? y : -1;
  })();

  function prevWeek() { const d=new Date(weekStart); d.setDate(d.getDate()-7); setWeekStart(d); }
  function nextWeek() { const d=new Date(weekStart); d.setDate(d.getDate()+7); setWeekStart(d); }
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
  const weekLabel = weekDays[0].toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' – ' +
                    weekEnd.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  const totalThisWeek = weekDays.reduce((n,d) => n + (apptsByDay[d.toDateString()]||[]).length, 0);

  return (
    <div className="sched-view">
      {/* ── Header ──────────────────────────────────────────────────────── */}
      <div className="sched-header">
        <div className="sched-header-left">
          <div className="view-strip-nav">
            <button className="pn-btn" onClick={onBack}>← Back</button>
            <span className="pn-sep">/</span>
            <button className="pn-btn pn-home" onClick={onHome}>⌂ Dashboard</button>
          </div>
          <div className="sched-title-row">
            <span className="sched-title-text">Schedules</span>
            {syncState === 'syncing' && (
              <span className="tebra-badge syncing"><span className="spin">↻</span> Syncing with Tebra & Therapy Notes…</span>
            )}
            {syncState === 'synced' && (
              <span className="tebra-badge synced">✓ Tebra & Therapy Notes synced · {lastSync ? lastSync.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : ''}</span>
            )}
          </div>
          {!loading && (
            <div style={{fontSize:12,color:'var(--ink-4)',marginLeft:4}}>
              {totalThisWeek} appointment{totalThisWeek!==1?'s':''} this week
            </div>
          )}
        </div>
        <div className="sched-week-nav">
          <button className="wn-btn" onClick={prevWeek} title="Previous week">‹</button>
          <span className="wn-label">{weekLabel}</span>
          <button className="wn-btn" onClick={nextWeek} title="Next week">›</button>
          <button className="wn-today" onClick={() => setWeekStart(schedGetMonday(new Date()))}>Today</button>
        </div>
      </div>

      {/* ── Provider tabs ────────────────────────────────────────────────── */}
      <div className="sched-providers">
        {SCHED_PROVIDERS.map(p => (
          <button key={p.id}
            className={`sched-prov-tab${selProv.id===p.id?' active':''}`}
            style={selProv.id===p.id ? {'--prov-active-color':p.color,'--prov-active-bg':p.bg,'--prov-active-text':p.text} : {}}
            onClick={() => handleProviderChange(p)}
          >
            <div className="spt-avatar" style={selProv.id===p.id?{background:p.color}:{}}>{p.avatar}</div>
            <div className="spt-info">
              <div className="spt-name">{p.name}, {p.cred}</div>
              <div className="spt-spec">{p.specialty}</div>
            </div>
          </button>
        ))}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:12,paddingLeft:16,borderLeft:'1px solid var(--hair)',flexShrink:0}}>
          {!loading && (
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:11,color:'var(--ink-4)',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600}}>This week</div>
              <div style={{fontSize:18,fontWeight:700,color:'var(--ink)',lineHeight:1.1}}>{totalThisWeek}</div>
            </div>
          )}
        </div>
      </div>

      {/* ── Body ────────────────────────────────────────────────────────── */}
      <div className="sched-body">
        {loading ? (
          <div className="sched-loading">
            <div className="sched-skel-header" style={{width:'60%'}} />
            <div className="sched-skel-header" style={{width:'40%',height:24}} />
            <div style={{marginTop:16}}>
              {Array.from({length:9},(_,i)=>(
                <div key={i} className="sched-skel-row" style={{animationDelay:`${i*80}ms`}} />
              ))}
            </div>
          </div>
        ) : (
          <>
            {/* Unscheduled strip */}
            {unscheduled.length > 0 && (
              <div className="sched-unscheduled">
                <div className="su-label">Unscheduled · {unscheduled.length}</div>
                <div className="su-chips">
                  {unscheduled.map(a => {
                    const c = SCHED_APPT_COLORS[a.appointment_type] || SCHED_APPT_COLORS.primary_care;
                    const href = a.intake_link_token ? `/?t=${a.intake_link_token}` : null;
                    return (
                      <div key={a.id} className="su-chip"
                        style={{borderColor:c.border,background:c.bg,color:c.text,cursor:href?'pointer':'default'}}
                        onClick={() => href && window.open(href, '_blank')}>
                        <div className="su-chip-name">{a.patient_name}</div>
                        <div className="su-chip-type">{c.label}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Day-of-week header row */}
            <div className="sched-cols-header">
              <div className="sched-time-gutter" />
              {weekDays.map((day,i) => {
                const isToday = day.getTime()===today.getTime();
                const isWeekend = i>=5;
                const cnt = (apptsByDay[day.toDateString()]||[]).length;
                return (
                  <div key={i} className={`sched-day-header${isToday?' today':''}${isWeekend?' weekend':''}`}>
                    <div className="sdh-dow">{day.toLocaleDateString('en-US',{weekday:'short'})}</div>
                    <div className={`sdh-date${isToday?' today-bubble':''}`}>{day.getDate()}</div>
                    {cnt>0 && <div className="sdh-appt-count">{cnt}</div>}
                  </div>
                );
              })}
            </div>

            {/* Scrollable time grid */}
            <div className="sched-grid-scroll">
              <div className="sched-grid" style={{height:GRID_H+'px'}}>
                {/* Time labels column */}
                <div className="sched-time-col">
                  {hours.map((h,i) => (
                    <div key={h} className="sched-time-label" style={{top:i*HOUR_H+1}}>
                      {h===12?'12 PM':h<12?`${h} AM`:`${h-12} PM`}
                    </div>
                  ))}
                </div>

                {/* Day columns */}
                {weekDays.map((day,i) => {
                  const isToday = day.getTime()===today.getTime();
                  const isWeekend = i>=5;
                  const dayAppts = apptsByDay[day.toDateString()] || [];
                  return (
                    <div key={i} className={`sched-day-col${isToday?' today':''}${isWeekend?' weekend':''}`}
                      style={{height:GRID_H+'px'}}>
                      {/* Hour / half-hour gridlines */}
                      {Array.from({length:HOUR_END-HOUR_START},(_,h)=>(
                        <React.Fragment key={h}>
                          <div className="sched-hour-line" style={{top:h*HOUR_H}} />
                          <div className="sched-half-line" style={{top:h*HOUR_H+HOUR_H/2}} />
                        </React.Fragment>
                      ))}
                      {/* Bottom boundary line */}
                      <div className="sched-hour-line" style={{top:GRID_H}} />

                      {/* Current time indicator */}
                      {isToday && nowY>=0 && <div className="sched-now-line" style={{top:nowY}} />}

                      {/* Appointment blocks */}
                      {dayAppts.map((a,ai) => {
                        const c = SCHED_APPT_COLORS[a.appointment_type] || SCHED_APPT_COLORS.primary_care;
                        const y = timeToY(a._dt);
                        const timeStr = a._dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
                        const blockH = Math.max(HOUR_H - 4, 44);
                        const href = a.intake_link_token ? `/?t=${a.intake_link_token}` : null;
                        return (
                          <div key={a.id} className="sched-appt-block"
                            onClick={() => href && window.open(href, '_blank')}
                            style={{
                              top: y+2, height: blockH,
                              borderLeftColor: c.border, background: c.bg, color: c.text,
                              left: `${4 + ai*2}px`,
                              cursor: href ? 'pointer' : 'default',
                            }}>
                            <div className="sab-time">{timeStr}</div>
                            <div className="sab-name">{a.patient_name}</div>
                            <div className="sab-type">{c.label}</div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Empty state when no appts for this provider */}
            {totalThisWeek === 0 && unscheduled.length === 0 && (
              <div className="sched-empty-state" style={{position:'absolute',bottom:80,left:0,right:0,pointerEvents:'none'}}>
                <div className="sched-empty-icon">📅</div>
                <div className="sched-empty-text">No appointments for {selProv.name.split(' ')[2]} this week</div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* Pre-Auth flow */
function InsPreAuth({ patient, onBack, onHome }) {
  const [step, setStep] = React.useState(0);
  const [subStep, setSubStep] = React.useState(0);
  const [msgs, setMsgs] = React.useState([]);
  const [typing, setTyping] = React.useState(false);
  const msgsRef = React.useRef(null);

  const STEPS = [
    { label: 'Auth Request Triggered', subs: ['EHR order detected', 'CPT code auth check', 'Payer rule match confirmed'], badge: 'auto' },
    { label: 'Clinical Data Extraction', subs: ['Pull labs & diagnosis codes', 'Pull prior visit history', 'Verify ordering provider NPI'], badge: 'auto' },
    { label: 'Payer Rules Lookup', subs: ['Query coverage policy', 'Validate criteria met', 'Confirm submission channel'], badge: 'auto' },
    { label: 'Auth Packet Submission', subs: ['Assemble clinical packet', 'Submit via payer portal API', 'Reference number issued'], badge: 'auto' },
    { label: 'Status Polling', subs: ['Day 1–3: polling daily', 'Day 4: no decision yet', 'Auto-escalate — P2P request'], badge: 'auto' },
    { label: 'Decision Received', subs: ['Auth decision logged', 'Syncing to Tebra & Therapy Notes', 'Scheduling triggered'], badge: 'auto' },
  ];

  const addMsg = (role, content) => setMsgs(m => [...m, { role, content, id: Date.now() + Math.random() }]);

  React.useEffect(() => {
    if (msgsRef.current) msgsRef.current.scrollTop = msgsRef.current.scrollHeight;
  }, [msgs, typing]);

  React.useEffect(() => {
    const seq = [
      [600, () => { setTyping(true); }],
      [1800, () => { setTyping(false); addMsg('agent', { type: 'text', text: `Hello — I'm the Pre-Authorization agent. I'll handle the prior auth for ${patient.name}'s upcoming ${patient.appt} with ${patient.insurance}. Starting now.` }); }],
      [2400, () => { setStep(1); setSubStep(1); addMsg('agent', { type: 'scan', title: 'Step 1 · Auth Request', items: ['EHR order detected', 'CPT code auth check', 'Payer rule match confirmed'], delays: [0, 900, 1800] }); }],
      [5200, () => { setSubStep(3); setStep(2); setSubStep(1); addMsg('agent', { type: 'text', text: 'Auth trigger confirmed. Pulling clinical data from Tebra & Therapy Notes now.' }); }],
      [5800, () => { addMsg('agent', { type: 'scan', title: 'Step 2 · Clinical Extraction (Tebra & Therapy Notes)', items: ['Pull labs & diagnosis codes', 'Pull prior visit history', 'Verify ordering provider NPI'], delays: [0, 1000, 2100] }); }],
      [9000, () => { setStep(3); setSubStep(1); addMsg('agent', { type: 'clinical', patient }); }],
      [10200, () => { setStep(4); setSubStep(1); addMsg('agent', { type: 'payer', patient }); }],
      [11800, () => { setStep(5); setSubStep(1); addMsg('agent', { type: 'text', text: 'Payer criteria verified. Assembling auth packet and submitting to ' + patient.insurance + '.' }); }],
      [12600, () => { addMsg('agent', { type: 'packet', patient }); }],
      [14000, () => { setStep(6); setSubStep(1); addMsg('agent', { type: 'poll' }); }],
      [17000, () => { addMsg('agent', { type: 'approved', patient }); }],
    ];
    const timers = seq.map(([delay, fn]) => setTimeout(fn, delay));
    return () => timers.forEach(clearTimeout);
  }, []);

  const renderMsg = (m) => {
    if (m.role === 'agent') {
      if (m.content.type === 'text') return (
        <div className="ins-msg agent">
          <div className="ins-msg-av ins-agent-av">E</div>
          <div className="ins-bubble">{m.content.text}</div>
        </div>
      );
      if (m.content.type === 'scan') return (
        <div className="ins-msg agent" style={{flexDirection:'column',gap:6}}>
          <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
            <div className="ins-msg-av ins-agent-av">E</div>
            <div className="ins-card" style={{maxWidth:'100%'}}>
              <div className="ins-card-header">
                <span style={{fontSize:13}}>⚙️</span>
                <div><div className="ins-card-title">{m.content.title}</div></div>
                <div className="ins-card-badge ins-badge-auto" style={{marginLeft:'auto'}}>Auto</div>
              </div>
              <div className="ins-card-body">
                {m.content.items.map((item, i) => (
                  <ScanRow key={i} label={item} delay={m.content.delays[i]} />
                ))}
              </div>
            </div>
          </div>
        </div>
      );
      if (m.content.type === 'clinical') return (
        <div className="ins-msg agent">
          <div className="ins-msg-av ins-agent-av">E</div>
          <div className="ins-card">

              <div className="ins-card-badge ins-badge-source">Tebra & Therapy Notes</div>

              <div className="ins-cg-item"><div className="ins-cg-label">Primary DX</div><div className="ins-cg-val">Z02.89</div></div>

function ScanRow({ label, delay }) {
  const [state, setState] = React.useState('pending');
  const [barW, setBarW] = React.useState(0);
  React.useEffect(() => {
    const t1 = setTimeout(() => { setState('active'); setBarW(60); }, delay + 200);
    const t2 = setTimeout(() => { setState('done'); setBarW(100); }, delay + 1100);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [delay]);
  return (
    <div className={`ins-scan-row ${state}`}>
      {state === 'active' ? <div className="ins-scan-spinner"/> : state === 'done' ? <span>✓</span> : <span style={{width:12,display:'inline-block'}}/>}
      <span style={{flex:1}}>{label}</span>
      <div className="ins-scan-bar-wrap"><div className="ins-scan-bar" style={{width:barW+'%'}}/></div>
    </div>
  );
}

/* ── App ─────────────────────────────────────────────────────────────────── */
function App() {
  const [page, setPage]             = React.useState('welcome');
  const [viewMode, setViewMode]     = React.useState('patient'); // 'patient' | 'clinic'
  const [intakeCtx, setIntakeCtx]   = React.useState(null);
  const [ctxLoading, setCtxLoading] = React.useState(false);
  const [privacyAcknowledged, setPrivacyAcknowledged] = React.useState(false);
  const [resolvedPatientInfo, setResolvedPatientInfo] = React.useState(null);

  // On mount: check for ?t=<token>; if present, load patient context and stay in patient view
  React.useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('t');
    if (!token) return;
    setCtxLoading(true);
    apiGet(`/intake/${token}`)
      .then(ctx => { setIntakeCtx(ctx); setViewMode('patient'); setPrivacyAcknowledged(false); setResolvedPatientInfo(null); })
      .catch(err => console.warn('Intake context load failed (service may be offline):', err))
      .finally(() => setCtxLoading(false));
  }, []);

  const effectivePatient = intakeCtx ? {
    name:         intakeCtx.patient.full_name,
    first:        intakeCtx.patient.first_name || intakeCtx.patient.full_name.split(' ')[0],
    appt:         intakeCtx.appointment.appointment_type.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
    date:         intakeCtx.appointment.appointment_date
                    ? new Date(intakeCtx.appointment.appointment_date).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
                    : '',
    provider:     intakeCtx.appointment.provider_name || '',
    description:  intakeCtx.appointment.appointment_description || '',
    patient_type: intakeCtx.appointment.patient_type || 'new',
    patient_id:   intakeCtx.patient.id,
    dob:          intakeCtx.patient.dob || '',
    email:        intakeCtx.patient.email || '',
    phone:        intakeCtx.patient.phone || '',
    location:     intakeCtx.appointment.clinic_location || '',
  } : PATIENT;
  const displayPatient = resolvedPatientInfo
    ? {
        ...effectivePatient,
        ...resolvedPatientInfo,
        first: resolvedPatientInfo.first || resolvedPatientInfo.name.split(/\s+/)[0],
      }
    : effectivePatient;

  const handlePrivacyAcknowledge = React.useCallback(async () => {
    const hipaaForm = intakeCtx?.forms?.find(f => (f.form_id || f.id) === 'hipaa');
    if (hipaaForm?.id && hipaaForm.status !== 'completed') {
      await apiPatch(`/forms/${hipaaForm.id}`, { status: 'completed' });
    }
    setPrivacyAcknowledged(true);
    if (hipaaForm) {
      setIntakeCtx(ctx => ctx ? ({
        ...ctx,
        forms: ctx.forms.map(f => (f.form_id || f.id) === 'hipaa' ? { ...f, status: 'completed' } : f),
      }) : ctx);
    }
  }, [intakeCtx]);

  if (ctxLoading) {
    return (
      <div className="app" style={{height:'100vh',display:'grid',placeItems:'center'}}>
        <div style={{textAlign:'center',color:'var(--ink-3)',fontSize:14}}>
          <div style={{marginBottom:12,fontSize:22,opacity:0.4}}>↻</div>
          Loading your intake session…
        </div>
      </div>
    );
  }

  return (
    <div className="app" style={{height:'100vh'}}>
      <Topbar
        patient={displayPatient}
        viewMode={viewMode}
        showPatientIdentity={viewMode !== 'patient' || !!resolvedPatientInfo}
        onToggleView={v => { setViewMode(v); if(v==='patient') setPage('welcome'); }}
      />
      {viewMode === 'clinic' ? (
        <div className="clinic-portal">
          <ClinicPortal />
        </div>
      ) : (
        <>
          {page === 'welcome' && (
            <WelcomePage
              patient={displayPatient}
              intakeCtx={intakeCtx}
              privacyAcknowledged={privacyAcknowledged}
              onAcknowledgePrivacy={handlePrivacyAcknowledge}
              onResolvedPatient={setResolvedPatientInfo}
              onChoose={setPage}
            />
          )}
          {page === 'docs'    && <DocListPage patient={displayPatient} intakeCtx={intakeCtx} onBack={() => setPage('welcome')} onHome={() => setPage('welcome')} onSwitchToAI={() => setPage('ai')} />}
          {page === 'ai'      && <AIIntakePage patient={displayPatient} intakeCtx={intakeCtx} onBack={() => setPage('welcome')} onHome={() => setPage('welcome')} />}
        </>
      )}
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
