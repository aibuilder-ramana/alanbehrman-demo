  font-size: 13.5px; line-height: 1.6;
}
.ins-msg.agent .ins-bubble {
  background: var(--surface); border: 1px solid var(--hair); color: var(--ink-2);
  border-radius: 4px 14px 14px 14px; box-shadow: var(--shadow-sm);
}
.ins-msg.user .ins-bubble {
  background: var(--teal-soft); border: 1px solid oklch(87% 0.05 250);
  color: var(--teal-deep); border-radius: 14px 4px 14px 14px;
}
.ins-typing { background: var(--surface); border: 1px solid var(--hair); padding: 12px 16px; border-radius: 4px 14px 14px 14px; display: flex; gap: 4px; align-items: center; box-shadow: var(--shadow-sm); }
.ins-typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--hair-strong); animation: bounce 0.9s infinite; }
.ins-typing-dot:nth-child(2) { animation-delay: 0.15s; }
.ins-typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-4px); } }
.ins-sys-msg { text-align: center; font-size: 11px; color: var(--ink-4); padding: 4px 0; font-style: italic; }

/* Agent cards */
.ins-card {
  max-width: 88%; background: var(--surface); border: 1px solid var(--hair);
  border-radius: 4px 14px 14px 14px; overflow: hidden;
  box-shadow: var(--shadow-sm); animation: fadeIn 0.3s ease;
}
.ins-card-header {
  padding: 10px 14px; background: var(--bg-tint); border-bottom: 1px solid var(--hair);
  display: flex; align-items: center; gap: 9px;
}
.ins-card-title { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.ins-card-sub { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.ins-card-badge { margin-left: auto; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; }
.ins-badge-source { background: oklch(93% 0.04 60); color: oklch(50% 0.12 60); border: 1px solid oklch(86% 0.08 60); }
.ins-badge-payer { background: oklch(94% 0.04 280); color: oklch(50% 0.12 280); border: 1px solid oklch(87% 0.06 280); }
.ins-badge-ok { background: var(--sage-soft); color: var(--sage); border: 1px solid oklch(86% 0.04 200); }
.ins-card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.ins-card-grid { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ins-cg-item { background: var(--bg-tint); border: 1px solid var(--hair); border-radius: var(--radius-sm); padding: 8px 10px; }
.ins-cg-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-4); margin-bottom: 3px; }
.ins-cg-val { font-size: 13px; font-weight: 600; color: var(--ink); }
.ins-cg-val.teal { color: var(--teal-deep); }
.ins-cg-val.amber { color: oklch(55% 0.12 70); }
.ins-cg-val.red { color: oklch(50% 0.18 25); }
.ins-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--hair); font-size: 12.5px; }
.ins-row:last-child { border-bottom: none; }
.ins-row-key { color: var(--ink-3); }
.ins-row-val { font-weight: 600; color: var(--ink); }
.ins-row-val.teal { color: var(--teal-deep); }
.ins-row-val.amber { color: oklch(55% 0.12 70); }
.ins-criteria-row {
  display: flex; align-items: flex-start; gap: 8px; padding: 7px 10px;
  border-radius: var(--radius-sm); background: var(--bg-tint); border: 1px solid var(--hair);
  font-size: 12px; color: var(--ink-2);
}
.ins-criteria-row.met { background: var(--sage-soft); border-color: oklch(86% 0.04 200); }
.ins-crit-icon { flex-shrink: 0; font-size: 13px; }
.ins-crit-text { flex: 1; line-height: 1.4; }
.ins-crit-status { font-size: 10px; font-weight: 700; color: var(--sage); flex-shrink: 0; }

/* Scan progress card */
.ins-scan-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--hair); font-size: 12px; color: var(--ink-4); transition: color 0.3s; }
.ins-scan-row:last-child { border-bottom: none; }
.ins-scan-row.active { color: var(--ink); }
.ins-scan-row.done { color: var(--sage); }
.ins-scan-spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--hair); border-top-color: var(--teal); animation: spin360 0.7s linear infinite; flex-shrink: 0; }
.ins-scan-bar-wrap { width: 56px; height: 3px; background: var(--hair); border-radius: 2px; flex-shrink: 0; margin-left: auto; }
.ins-scan-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--sage)); border-radius: 2px; transition: width 1.1s ease; }

/* Result banner */
.ins-result-banner {
  max-width: 88%; padding: 16px; border-radius: 4px 14px 14px 14px; overflow: hidden;
  display: flex; align-items: center; gap: 14px; animation: fadeIn 0.4s ease;
}
.ins-result-banner.approved { background: var(--sage-soft); border: 1px solid oklch(85% 0.05 200); }
.ins-result-banner.validated { background: var(--teal-soft); border: 1px solid oklch(87% 0.05 250); }
.ins-result-icon { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.ins-result-banner.approved .ins-result-icon { background: oklch(90% 0.04 200); }
.ins-result-banner.validated .ins-result-icon { background: oklch(90% 0.04 250); }
.ins-result-title { font-size: 14px; font-weight: 700; }
.ins-result-banner.approved .ins-result-title { color: var(--sage); }
.ins-result-banner.validated .ins-result-title { color: var(--teal-deep); }
.ins-result-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.5; }
.ins-ref { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--teal-soft); border: 1px solid oklch(87% 0.05 250); color: var(--teal-deep); }

/* Poll track */
.ins-poll-track { padding: 14px; display: flex; gap: 0; align-items: stretch; position: relative; }
.ins-poll-track::before { content: ''; position: absolute; top: 25px; left: 28px; right: 28px; height: 2px; background: var(--hair); z-index: 0; }
.ins-pt-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; z-index: 1; }
.ins-pt-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--hair); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: var(--ink-4); background: var(--surface); }
.ins-pt-step.done .ins-pt-dot { border-color: var(--sage); color: var(--sage); background: var(--sage-soft); }
.ins-pt-step.pending .ins-pt-dot { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
.ins-pt-label { font-size: 10px; color: var(--ink-4); text-align: center; line-height: 1.35; }

.ins-input-bar { padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--hair); display: flex; gap: 10px; flex-shrink: 0; }
.ins-input { flex: 1; padding: 9px 14px; border: 1px solid var(--hair); border-radius: var(--radius); font-family: inherit; font-size: 13.5px; color: var(--ink); background: var(--bg); outline: none; transition: border-color 0.15s; }
.ins-input:focus { border-color: var(--teal); }
.ins-send-btn { width: 38px; height: 38px; border-radius: var(--radius); background: linear-gradient(135deg, var(--teal), var(--sage)); border: none; color: white; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; flex-shrink: 0; }
.ins-send-btn:hover { transform: scale(1.06); }

/* ── Clinical Chart Overlay ──────────────────────────────────────────────── */
.chart-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(10, 18, 28, 0.72);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  animation: fadeIn 0.2s ease;
}
.chart-panel {
  width: 100%; max-width: 1180px; height: 92vh;
  background: var(--surface);
  border-radius: 14px;
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 32px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(20,30,40,0.08);
  animation: chartSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes chartSlideUp { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: none; } }

/* Chart header bar */
.chart-header {
  background: oklch(20% 0.018 240);
  padding: 0 20px;
  height: 56px;
  display: flex; align-items: center; gap: 16px;
  flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.chart-mrn { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
.chart-pt-name { font-size: 17px; font-weight: 600; color: white; letter-spacing: -0.01em; }
.chart-pt-meta { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 1px; }
.chart-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.1); flex-shrink: 0; }
.chart-encounter-badge {
  padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
  background: oklch(55% 0.14 250 / 0.2); color: oklch(75% 0.1 250);
  border: 1px solid oklch(55% 0.14 250 / 0.3);
}
.chart-ai-badge {
  display: flex; align-items: center; gap: 5px; padding: 4px 10px;
  border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
  background: oklch(55% 0.08 200 / 0.15); color: oklch(72% 0.08 200);
  border: 1px solid oklch(55% 0.08 200 / 0.3);
}
.chart-ai-dot { width: 5px; height: 5px; border-radius: 50%; background: oklch(72% 0.08 200); animation: blink 2s infinite; }
.chart-close {
  margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: none;
  background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55);
  cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s; flex-shrink: 0;
}
.chart-close:hover { background: rgba(255,255,255,0.12); color: white; }

/* Patient banner */
.chart-pt-banner {
  background: oklch(15% 0.02 240);
  padding: 10px 20px;
  display: flex; align-items: center; gap: 20px;
  flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  flex-wrap: wrap;
}
.chart-banner-item { display: flex; flex-direction: column; gap: 1px; }
.chart-banner-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.3); }
.chart-banner-val { font-size: 12.5px; font-weight: 500; color: rgba(255,255,255,0.75); }
.chart-banner-val.alert { color: oklch(72% 0.16 25); }
.chart-banner-val.ok { color: oklch(72% 0.1 200); }
.chart-banner-sep { width: 1px; height: 28px; background: rgba(255,255,255,0.07); flex-shrink: 0; }

/* Body layout */
.chart-body { display: flex; flex: 1; overflow: hidden; }

/* Left nav */
.chart-nav {
  width: 170px; flex-shrink: 0;
  background: oklch(17% 0.018 240);
  border-right: 1px solid rgba(255,255,255,0.05);
  display: flex; flex-direction: column;
  overflow-y: auto; padding: 8px 0;
}
.chart-nav-section { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.2); padding: 10px 14px 4px; }
.chart-nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 14px; cursor: pointer;
  font-size: 12.5px; color: rgba(255,255,255,0.45);
  transition: background 0.15s, color 0.15s; border: none; background: none;
  width: 100%; text-align: left; font-family: inherit;
}
.chart-nav-item:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.7); }
.chart-nav-item.active { background: oklch(55% 0.14 250 / 0.15); color: oklch(78% 0.1 250); border-right: 2px solid oklch(60% 0.14 250); }
.chart-nav-icon { font-size: 13px; flex-shrink: 0; opacity: 0.7; }
.chart-nav-item.active .chart-nav-icon { opacity: 1; }
.chart-nav-badge { margin-left: auto; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; background: oklch(55% 0.14 250 / 0.2); color: oklch(72% 0.1 250); }

/* Main content */
.chart-main { flex: 1; overflow-y: auto; background: var(--bg); padding: 20px 24px; }
.chart-main::-webkit-scrollbar { width: 5px; }
.chart-main::-webkit-scrollbar-thumb { background: var(--hair-strong); border-radius: 3px; }

/* Section headers */
.chart-sec-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 2px solid var(--hair); display: flex; align-items: center; gap: 8px;
}
.chart-sec-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; text-transform: none; letter-spacing: 0; }
.chart-sec-badge.tebra { background: oklch(93% 0.04 60); color: oklch(48% 0.12 60); border: 1px solid oklch(86% 0.08 60); }
.chart-sec-badge.ai { background: var(--teal-soft); color: var(--teal-deep); border: 1px solid oklch(87% 0.05 250); }

/* Data tables */
.chart-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
.chart-table th { text-align: left; padding: 7px 12px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-4); background: var(--bg-tint); border-bottom: 1px solid var(--hair); }
.chart-table td { padding: 9px 12px; border-bottom: 1px solid var(--hair); vertical-align: top; color: var(--ink-2); line-height: 1.4; }
.chart-table tr:last-child td { border-bottom: none; }
.chart-table tr:hover td { background: var(--bg-tint); }
.ct-status-active { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; background: var(--sage-soft); color: var(--sage); border: 1px solid oklch(86% 0.04 200); }
.ct-status-resolved { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; background: var(--bg-tint); color: var(--ink-4); border: 1px solid var(--hair); }
.ct-status-alert { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; background: oklch(95% 0.05 25); color: oklch(48% 0.18 25); border: 1px solid oklch(88% 0.08 25); }
.ct-status-pending { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; background: oklch(96% 0.04 80); color: oklch(52% 0.12 70); border: 1px solid oklch(88% 0.08 80); }

/* Vitals grid */
.chart-vitals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
.chart-vital-card {
  background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
}
.chart-vital-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-4); }
.chart-vital-val { font-size: 22px; font-weight: 300; color: var(--ink); letter-spacing: -0.02em; line-height: 1; }
.chart-vital-unit { font-size: 11px; color: var(--ink-4); }
.chart-vital-trend { font-size: 11px; margin-top: 2px; }
.chart-vital-trend.normal { color: var(--sage); }
.chart-vital-trend.elevated { color: oklch(52% 0.12 70); }

const CREDIT_CARD_TYPES = ['Amex', 'Discover', 'Mastercard', 'Visa'];

function parseAddressParts(rawAddress) {
  const value = String(rawAddress || '').replace(/\s+/g, ' ').trim();
  if (!value) return { street: '', city: '', state: '', zip: '' };
  const zipMatch = value.match(/\b(\d{5}(?:-\d{4})?)\b/);
  const stateMatch = value.match(/\b([A-Z]{2})\s+\d{5}(?:-\d{4})?\b/i);
  const parts = value.split(',').map(part => part.trim()).filter(Boolean);
  if (parts.length >= 3) {
    return {
      street: parts.slice(0, -2).join(', '),
      city: parts[parts.length - 2] || '',
      state: stateMatch ? stateMatch[1].toUpperCase() : '',
      zip: zipMatch ? zipMatch[1] : '',
    };
  }
  return { street: value, city: '', state: stateMatch ? stateMatch[1].toUpperCase() : '', zip: zipMatch ? zipMatch[1] : '' };
}

function normalizeOcrDigits(value) {
  return String(value || '')
    .replace(/[OoQ]/g, '0')
    .replace(/[Il|!]/g, '1')
    .replace(/[Ss]/g, '5')
    .replace(/[Bb]/g, '8');
}

function passesLuhn(value) {
  const digits = String(value || '').replace(/\D/g, '');
  if (digits.length < 12) return false;
  let sum = 0;
  let doubleDigit = false;
  for (let i = digits.length - 1; i >= 0; i -= 1) {
    let n = Number(digits[i]);
    if (doubleDigit) {
      n *= 2;
      if (n > 9) n -= 9;
    }
    sum += n;
    doubleDigit = !doubleDigit;
  }
  return sum % 10 === 0;
}

function formatCardNumber(value) {
  const digits = String(value || '').replace(/\D/g, '').slice(0, 19);
  if (!digits) return '';
  return digits.replace(/(.{4})/g, '$1 ').trim();
}

function maskCardNumber(value) {
  const digits = String(value || '').replace(/\D/g, '');
  if (!digits) return '';
  return `Ending ${digits.slice(-4)}`;
}

function inferCardType(cardNumber, text = '') {
  const digits = String(cardNumber || '').replace(/\D/g, '');
  const upper = String(text || '').toUpperCase();
  if (/AMEX|AMERICAN\s+EXPRESS/.test(upper) || /^3[47]/.test(digits)) return 'Amex';
  if (/DISCOVER/.test(upper) || /^(6011|65|64[4-9])/.test(digits)) return 'Discover';
  const firstTwo = Number(digits.slice(0, 2));
  const firstFour = Number(digits.slice(0, 4));
  if (/MASTERCARD|MASTER\s*CARD/.test(upper) || (firstTwo >= 51 && firstTwo <= 55) || (firstFour >= 2221 && firstFour <= 2720)) return 'Mastercard';
  if (/\bVISA\b/.test(upper) || /^4/.test(digits)) return 'Visa';
  return '';
}

function extractCardNumberFromOcr(text) {
  const normalized = normalizeOcrDigits(text);
  const candidates = [...normalized.matchAll(/(?:\d[\s-]*){12,19}/g)]
    .map(match => match[0].replace(/\D/g, ''))
    .filter(digits => digits.length >= 13 && digits.length <= 19)
    .sort((a, b) => {
      const luhnScore = Number(passesLuhn(b)) - Number(passesLuhn(a));
      return luhnScore || b.length - a.length;
    });
  return candidates[0] || '';
}

function extractExpirationFromOcr(text) {
  const normalized = normalizeOcrDigits(text);
  const match = normalized.match(/\b(0[1-9]|1[0-2])\s*[\/.\-]\s*(\d{2}|\d{4})\b/);
  if (!match) return '';
  return `${match[1]}/${match[2].slice(-2)}`;
}

function extractNameFromOcr(text) {
  const blocked = /\b(BANK|CARD|CREDIT|DEBIT|VALID|THRU|UNTIL|VISA|MASTERCARD|MASTER|AMEX|AMERICAN|EXPRESS|DISCOVER|MEMBER|CUSTOMER|SIGNATURE|AUTHORIZED|ELECTRONIC|USE|ONLY|VOID)\b/;
  const lines = String(text || '').split(/\r?\n/)
    .map(line => line.replace(/[^A-Za-z\s'.-]/g, ' ').replace(/\s+/g, ' ').trim())
    .filter(line => line.length >= 5 && line.length <= 34 && /[A-Za-z]{2,}\s+[A-Za-z]{2,}/.test(line));
  const match = lines.find(line => {
    const upper = line.toUpperCase();
    return upper === line && !blocked.test(upper);
  }) || lines.find(line => !blocked.test(line.toUpperCase()));
  return match ? match.replace(/\b\w/g, char => char.toUpperCase()) : '';
}

function extractCvcFromOcr(text, side) {
  const normalized = normalizeOcrDigits(text);
  const labeled = normalized.match(/\b(?:CVC|CVV|CID|SECURITY\s*CODE)\D{0,18}(\d{3,4})\b/i);
  if (labeled) return labeled[1];
  if (side !== 'credit_card_back') return '';
  const withoutLongNumbers = normalized
    .replace(/(?:\d[\s-]*){12,19}/g, ' ')
    .replace(/\b(0[1-9]|1[0-2])\s*[\/.\-]\s*(\d{2}|\d{4})\b/g, ' ');
  const groups = [...withoutLongNumbers.matchAll(/\b\d{3,4}\b/g)].map(match => match[0]);
  return groups[groups.length - 1] || '';
}

function extractCreditCardFields(text, side) {
  const cardNumber = extractCardNumberFromOcr(text);
  return {
    card_number: formatCardNumber(cardNumber),
    expiration: extractExpirationFromOcr(text),
    cvc: extractCvcFromOcr(text, side),
    your_name: side === 'credit_card_front' ? extractNameFromOcr(text) : '',
    card_type: inferCardType(cardNumber, text),
  };
}

function patientAge(dob) {
  if (!dob) return null;
  const date = new Date(`${dob}T00:00:00`);
  if (Number.isNaN(date.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - date.getFullYear();
  const monthDelta = today.getMonth() - date.getMonth();
  if (monthDelta < 0 || (monthDelta === 0 && today.getDate() < date.getDate())) age -= 1;
  return age;
}

function shouldInclude(text, pattern) {
  return pattern.test(String(text || ''));
}

function buildDynamicFormPacket({ selectedAppointment, needsData, basicInfo, patient }) {
  const concernText = [
    needsData.presenting_concern,
    needsData.general_fit,
    selectedAppointment?.provider?.specialty,
  ].filter(Boolean).join(' ');
  const age = patientAge(basicInfo.dob || patient.dob);
  const packet = [
    { ...ALAN_FORMS.hipaa, reason:'Exact HIPAA form from AlanBehrman Step Two.' },
    { ...(age !== null && age < 18 ? ALAN_FORMS.clientMinor : ALAN_FORMS.clientInfo), reason: age !== null && age < 18 ? 'Minor client information form based on date of birth.' : 'Client information form from AlanBehrman Step Two.' },
    { ...ALAN_FORMS.cancellation, reason:'Required Step Three cancellation policy.' },
    { ...ALAN_FORMS.surpriseBilling, reason:'Relevant billing disclosure from Step Four.' },
  ];
  const providerForm = providerConsentForm(selectedAppointment?.provider?.name);
  if (providerForm) packet.push(providerForm);

  if (needsData.insurance_mode) packet.push({ ...ALAN_FORMS.insuranceAuth, reason:'Added because insurance information was collected during intake.' });
  if (shouldInclude(concernText, /\b(couple|partner|marriage|marital|relationship|family|relational)\b/i)) packet.push({ ...ALAN_FORMS.relationalIntake, reason:'Added because the concern appears relational or family-oriented.' });
  if (shouldInclude(concernText, /\b(coach|coaching|career|leadership|executive|life\s+goal)\b/i)) packet.push({ ...ALAN_FORMS.coachingConsent, reason:'Added because the concern appears coaching-related.' });
  if (shouldInclude(concernText, /\b(release|records|coordinate|school|attorney|court|doctor|physician|psychiatrist)\b/i)) packet.push({ ...ALAN_FORMS.releaseInfo, reason:'Added because the concern mentions records, coordination, or a third party.' });
  CONCERN_SCREENERS.forEach(form => {
    if (form.matches.test(concernText)) packet.push(form);
  });

  const seen = new Set();
  return packet.filter(form => {
    if (seen.has(form.id)) return false;
    seen.add(form.id);
    return true;
  });
}

function SignaturePad({ onChange }) {
  const canvasRef = React.useRef(null);
  const drawingRef = React.useRef(false);
  const hasInkRef = React.useRef(false);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const scale = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(rect.width * scale));
    canvas.height = Math.max(1, Math.floor(rect.height * scale));
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1f2933';
  }, []);

  const pointFromEvent = event => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const point = event.touches?.[0] || event;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  };

  const start = event => {
    event.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const point = pointFromEvent(event);
    drawingRef.current = true;
    ctx.beginPath();
    ctx.moveTo(point.x, point.y);
    if (!hasInkRef.current) {
      hasInkRef.current = true;
      onChange?.(true);
    }
  };

  const draw = event => {
    if (!drawingRef.current) return;
    event.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const point = pointFromEvent(event);
    ctx.lineTo(point.x, point.y);
    ctx.stroke();
  };

  const stop = () => {
    drawingRef.current = false;
  };

  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasInkRef.current = false;
    onChange?.(false);
  };

  return (
    <div className="hipaa-signature-pad">
      <canvas
        ref={canvasRef}
        onMouseDown={start}
        onMouseMove={draw}
        onMouseUp={stop}
        onMouseLeave={stop}
        onTouchStart={start}
        onTouchMove={draw}
        onTouchEnd={stop}
        aria-label="Draw e-signature"
      />
      <div className="hipaa-signature-actions">
        <span>Draw signature</span>
        <button type="button" className="hipaa-clear" onClick={clear}>Clear</button>
      </div>
    </div>
  );
}

  function findEhrMatch() {
    const candidate = {
      name: basicInfo.name,
      dob: basicInfo.dob,
      email: basicInfo.email,
      phone: basicInfo.phone,
    };
    const records = [
      {
        name: patient.name,
        dob: patient.dob || '',
        email: patient.email || '',
        phone: patient.phone || '',
        source: 'Tebra',
        confidence: 'High confidence match',
      },
      {
        name: 'Paranjit Kaur',
        dob: '',

        phone: '2533978683',

        name: 'Avery Johnson',
        dob: '1988-09-12',
        email: 'avery.johnson@example.com',
        phone: '4045550188',
        source: 'Tebra',
        confidence: 'Existing chart located',
      },
    ].filter(r => r.name);

    return records.find(record => {
      const nameMatch = normalize(record.name) && normalize(record.name) === normalize(candidate.name);
      const dobMatch = record.dob && candidate.dob && record.dob === candidate.dob;
      const emailMatch = normalize(record.email) && normalize(record.email) === normalize(candidate.email);
      const phoneMatch = normalizePhone(record.phone) && normalizePhone(record.phone) === normalizePhone(candidate.phone);
      return nameMatch || emailMatch || phoneMatch || (dobMatch && normalize(candidate.name).slice(0, 4) === normalize(record.name).slice(0, 4));
    });

  async function handleCreditUpload(docKey, fileList) {
    const file = fileList && fileList[0];
    if (!file) return;
    setUploadedDocs(docs => ({ ...docs, [docKey]: file.name || 'Photo ready' }));
    setCredit('mode', 'upload');
    if (!file.type.startsWith('image/')) {
      setCreditOcrStatus(status => ({
        ...status,
        [docKey]: { state: 'skipped', message: 'OCR works with image uploads. Review the fields below.' },
      }));
      return;
    }
    if (!window.Tesseract?.recognize) {
      setCreditOcrStatus(status => ({
        ...status,
        [docKey]: { state: 'skipped', message: 'OCR is unavailable. Review the fields below.' },
      }));
      return;
    }
    setCreditOcrStatus(status => ({
      ...status,
      [docKey]: { state: 'running', message: 'Reading card image...' },
    }));
    try {
      const result = await window.Tesseract.recognize(file, 'eng', {
        logger: progress => {
          if (progress.status === 'recognizing text') {
            const pct = Math.max(1, Math.round((progress.progress || 0) * 100));
            setCreditOcrStatus(status => ({
              ...status,
              [docKey]: { state: 'running', message: `Reading card image... ${pct}%` },
            }));
          }
        },
      });
      const text = result?.data?.text || '';
      const extracted = extractCreditCardFields(text, docKey);
      setCreditData(data => ({
        ...data,
        your_name: data.your_name || extracted.your_name || '',
        card_type: extracted.card_type || data.card_type,
        card_number: extracted.card_number || data.card_number,
        expiration: extracted.expiration || data.expiration,
        cvc: extracted.cvc || data.cvc,

        extracted.card_type,
        extracted.card_number && maskCardNumber(extracted.card_number),
        extracted.expiration && `exp ${extracted.expiration}`,
        extracted.cvc && 'CVC',
      ].filter(Boolean).join(' · ');
      setCreditOcrStatus(status => ({
        ...status,
        [docKey]: {
          state: 'done',
          message: found ? `Extracted ${found}.` : 'No fields were confidently extracted. Review the fields below.',
        },
      }));
    } catch (err) {
      console.warn('Credit card OCR failed:', err);
      setCreditOcrStatus(status => ({
        ...status,
        [docKey]: { state: 'error', message: 'OCR could not read this image. Review the fields below.' },
      }));
    }
  }

                  ))}
                </div>
              </>
            )}

            {needsStep === 2 && (
              <>
                <div className="workflow-prompt">
                  <h3>When would you prefer to come in?</h3>
                  <p>Tell us dates, times, or general availability.</p>
                </div>
                <div className="basic-field full">
                  <label htmlFor="needs-times">Preferred dates/times</label>
                  <div className="chat-input-shell">
                    <textarea
                      id="needs-times"
                      className="basic-input chat-input-field"
                      value={needsData.preferred_times}
                      onChange={e => setNeeds('preferred_times', e.target.value)}
                    />
                    {!needsData.preferred_times && (
                      <div className="chat-placeholder" key={timeHintIndex} aria-hidden="true">{timeHints[timeHintIndex]}</div>
                    )}
                  </div>
                  <div className="hint-rotator" aria-hidden="true">
                    <span>Try:</span>
                    <span key={timeHintIndex}>{timeHints[timeHintIndex]}</span>
                  </div>
                </div>
              </>
            )}

            {needsStep === 3 && (
              <>
                {insuranceAuthStage === 'idle' ? (
                  <>
                    <div className="workflow-prompt">
                      <h3>How would you like to share insurance information?</h3>
                      <p>You can upload photos from your phone camera or type the insurance details manually.</p>
                    </div>
                    <div className="insurance-mode">
                      <button type="button" className={needsData.insurance_mode === 'upload' ? 'active' : ''} onClick={() => setNeeds('insurance_mode', 'upload')}>Upload cards</button>
                      <button type="button" className={needsData.insurance_mode === 'manual' ? 'active' : ''} onClick={() => setNeeds('insurance_mode', 'manual')}>Enter manually</button>
                    </div>

                    {needsData.insurance_mode === 'upload' ? (
                      <div className="upload-stack">
                        <UploadCard docKey="insurance_front" title="Insurance card front" />
                        <UploadCard docKey="insurance_back" title="Insurance card back" />
                        <UploadCard docKey="driver_id" title="Driver's license / ID" />
                      </div>
                    ) : (
                      <div className="basic-form-grid">
                        <div className="basic-field">
                          <label htmlFor="ins-carrier">Insurance carrier</label>
                          <input id="ins-carrier" className="basic-input" value={needsData.insurance_carrier} onChange={e => setNeeds('insurance_carrier', e.target.value)} placeholder="Aetna, BCBS, United..." />
                        </div>
                        <div className="basic-field">
                          <label htmlFor="ins-member">Member ID</label>
                          <input id="ins-member" className="basic-input" value={needsData.insurance_member_id} onChange={e => setNeeds('insurance_member_id', e.target.value)} placeholder="Member ID" />
                        </div>
                        <div className="basic-field">
                          <label htmlFor="ins-group">Group ID</label>
                          <input id="ins-group" className="basic-input" value={needsData.insurance_group_id} onChange={e => setNeeds('insurance_group_id', e.target.value)} placeholder="Group number" />
                        </div>
                        <div className="basic-field">
                          <label htmlFor="ins-policyholder">Policyholder</label>
                          <input id="ins-policyholder" className="basic-input" value={needsData.policyholder_name} onChange={e => setNeeds('policyholder_name', e.target.value)} placeholder="Policyholder name" />
                        </div>
                      </div>
                    )}
                  </>
                ) : insuranceAuthStage === 'running' ? (
                  <div className="insurance-auth-panel">
                    <div className="insurance-auth-head">
                      <div className="insurance-auth-mark running">E</div>
                      <div>
                        <h3 className="insurance-auth-title">Verifying coverage and authorization</h3>
                        <p className="insurance-auth-sub">Elevia is reading the insurance details, checking payer eligibility, and calculating the patient estimate.</p>
                      </div>
                    </div>
                    <div className="insurance-auth-steps">
                      {insuranceAuthSteps.map((stepLabel, index) => (
                        <div key={stepLabel} className={`insurance-auth-step${insuranceAuthStep === index + 1 ? ' active' : insuranceAuthStep > index + 1 ? ' done' : ''}`}>
                          <span className="insurance-auth-dot">{insuranceAuthStep > index + 1 ? '✓' : index + 1}</span>
                          <span>{stepLabel}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="coverage-summary">
                    <div className="coverage-banner">
                      <div className="insurance-auth-mark">✓</div>
                      <div>
                        <strong>Coverage verified</strong>
                        <span>{coverageResult.payer} · {coverageResult.member} · Reference {coverageResult.reference}</span>
                      </div>
                    </div>
                    <div className="coverage-grid">
                      <div className="coverage-item">
                        <div className="k">Coverage</div>
                        <div className="v">{coverageResult.status}</div>
                      </div>
                      <div className="coverage-item">
                        <div className="k">Network</div>
                        <div className="v">{coverageResult.network}</div>
                      </div>
                      <div className="coverage-item">
                        <div className="k">Authorization</div>
                        <div className="v">{coverageResult.authorization}</div>
                      </div>
                      <div className="coverage-item">
                        <div className="k">Deductible</div>
                        <div className="v">{coverageResult.deductible}</div>
                      </div>
                      <div className="coverage-item">
                        <div className="k">Coinsurance</div>
                        <div className="v">{coverageResult.coinsurance}</div>
                      </div>
                      <div className="coverage-item">
                        <div className="k">Plan</div>
                        <div className="v">{coverageResult.payer}</div>
                      </div>
                    </div>
                    <div className="copay-highlight">
                      <div>
                        <div className="insurance-auth-title">Estimated patient copay</div>
                        <p className="insurance-auth-sub">Final patient responsibility may vary after payer adjudication.</p>
                      </div>
                      <div className="amount">{coverageResult.copay}</div>
                    </div>
                    <div className="coverage-note">
                      This coverage estimate has been shared with the AlanBehrman team and will be reviewed before your appointment.
                    </div>
                  </div>
                )}
              </>
            )}

            {needsStep === 4 && (
              <>
                <div className="workflow-prompt">
                  <h3>Anything that would help us find the right fit?</h3>
                  <p>Feel free to share anything — provider preferences, language needs, accessibility requirements, or anything on your mind.</p>
                </div>
                <div className="basic-field full">
                  <label htmlFor="needs-fit">Tell us anything helpful</label>
                  <textarea
                    id="needs-fit"
                    className="basic-input"
                    value={needsData.general_fit}
                    onChange={e => setNeeds('general_fit', e.target.value)}
                    placeholder="Language preferences, accessibility needs, anything you'd like us to know…"
                  />
                </div>
              </>
            )}

            <div className="workflow-nav">
              <button className="btn btn-ghost" type="button" onClick={backNeedsStep} disabled={needsStep === 0 || insuranceAuthStage === 'running'}>
                Back
              </button>
              <button className="btn btn-accent btn-lg" type="submit" disabled={insuranceAuthStage === 'running'}>
                {needsStep === 3 && insuranceAuthStage === 'idle'
                  ? 'Check my coverage'
                  : needsStep === 3 && insuranceAuthStage === 'running'
                    ? 'Checking...'
                    : needsStep === needsSteps.length - 1 ? 'Find my provider' : 'Continue'}
              </button>
            </div>
          </form>
        ) : matchResult?.status === 'new' && needsComplete && !selectedAppointment ? (
          <div className="appointment-panel">
            <div className="match-badge">Great news — times available</div>
            <h2>Pick a time that works for you</h2>
            <p>
              Here are available times near you that match your preferences. Pick one and we'll hold it while we review your intake.
            </p>
            <div className="appointment-source">
              <strong>{selectedLocation.name}</strong>
              <span>{selectedLocation.address.join(', ')}</span>
              <span>Preferred: {needsData.preferred_times || 'first available appointment'}</span>
              <a href={locationTeamUrl} target="_blank" rel="noreferrer">Team page</a>
            </div>
            <div className="appointment-list">
              {availableAppointments.map(appt => (
                <div
                  key={appt.id}
                  className="appointment-card"
                  role="button"
                  tabIndex="0"
                  onClick={() => { setSelectedAppointment(appt); setCreditCardComplete(false); resetConfirmationHandoff(); }}
                  onKeyDown={e => {
                    if (e.key === 'Enter' || e.key === ' ') {
                      e.preventDefault();
                      setSelectedAppointment(appt);
                      setCreditCardComplete(false);
                      resetConfirmationHandoff();
                    }
                  }}
                >
                  <div>
                    <div className="appointment-time">{appt.time}</div>
                    <div className="appointment-meta">{appt.matchLabel} · {appt.location}</div>
                  </div>
                  <div className="appointment-provider">
                    <strong>{appt.provider.name}</strong>
                    <span>Medical provider · {appt.provider.specialty}</span>
                    <a href={appt.provider.url} target="_blank" rel="noreferrer" onClick={e => e.stopPropagation()}>
                      Meet your provider
                    </a>
                  </div>
                  <span className="appointment-select">Choose</span>
                </div>
              ))}
            </div>
            <div className="workflow-nav">
              <button className="btn btn-ghost" type="button" onClick={() => { setNeedsComplete(false); setNeedsStep(4); }}>
                Back
              </button>
            </div>
          </div>
        ) : matchResult?.status === 'new' && selectedAppointment && !creditCardComplete ? (
          <form
            className="credit-auth-panel"
            id="credit-card-authorization-form"
            onSubmit={e => {
              e.preventDefault();
              if (creditCanSubmit) {
                setCreditCardComplete(true);
                startConfirmationHandoff();
              }
            }}
          >
            <div className="match-badge">Step One</div>
            <h2>Credit Card Authorization</h2>
            <p>
              Add the billing authorization required to hold your appointment. No charge happens today — a staff member reviews everything first.
            </p>
            <a className="credit-auth-link" href="https://www.alanbehrman.com/forms/" target="_blank" rel="noreferrer">
              Source form · alanbehrman.com/forms
            </a>
            <div className="credit-notice">
              Selected appointment: {selectedAppointment.time} with {selectedAppointment.provider.name}. Card details are collected for billing authorization after scheduling is confirmed.
            </div>
            <div className="insurance-mode">
              <button type="button" className={creditData.mode === 'manual' ? 'active' : ''} onClick={() => setCredit('mode', 'manual')}>Enter manually</button>
              <button type="button" className={creditData.mode === 'upload' ? 'active' : ''} onClick={() => setCredit('mode', 'upload')}>Upload photos</button>
            </div>

            {creditData.mode === 'manual' ? (
              renderCreditAuthorizationFields()
            ) : (
              <>
                <div className="credit-upload-grid">
                  <CreditUploadCard docKey="credit_card_front" title="Credit card front" />
                  <CreditUploadCard docKey="credit_card_back" title="Credit card back" />
                </div>
                <div className="credit-ocr-summary">
                  <div className="credit-ocr-item">
                    <div className="k">Card type</div>
                    <div className="v">{creditData.card_type || 'Review'}</div>
                  </div>
                  <div className="credit-ocr-item">
                    <div className="k">Card number</div>
                    <div className="v">{maskCardNumber(creditData.card_number) || 'Review'}</div>
                  </div>
                  <div className="credit-ocr-item">
                    <div className="k">Expiration</div>
                    <div className="v">{creditData.expiration || 'Review'}</div>
                  </div>
                </div>
                {renderCreditAuthorizationFields()}
              </>
            )}

            <label className="ack-check">
              <input type="checkbox" checked={creditData.authorization} onChange={e => setCredit('authorization', e.target.checked)} />
              <span>
                <strong>I authorize AlanBehrman to keep this card on file for appointment-related charges after staff confirmation.</strong>
                <small>Card photos are used in this browser to prefill the authorization fields for staff review.</small>
              </span>
            </label>
            <div className="workflow-nav">
              <button className="btn btn-ghost" type="button" onClick={() => { setSelectedAppointment(null); setCreditCardComplete(false); resetConfirmationHandoff(); }}>
                Back
              </button>
              <button className="btn btn-accent btn-lg" type="submit" disabled={!creditCanSubmit}>
                Hold my appointment
              </button>
            </div>
          </form>
        ) : matchResult?.status === 'new' && selectedAppointment && creditCardComplete ? (
          <div className="confirmation-panel">
            <div className="match-badge">Step 4 · All done!</div>
            <h2>{confirmationStage === 'complete' ? 'You\'re booked!' : 'Confirming your appointment'}</h2>
            <p>
              You're almost done! We're sending your confirmation and getting your provider ready.
            </p>
            {confirmationStage !== 'complete' ? (
              <div className="insurance-auth-panel">
                <div className="insurance-auth-head">
                  <div className="insurance-auth-mark running">E</div>
                  <div>
                    <h3 className="insurance-auth-title">Almost there — wrapping things up</h3>
                    <p className="insurance-auth-sub">Sending your confirmation, paperwork, and notifying your provider.</p>
                  </div>
                </div>
                <div className="insurance-auth-steps">
                  {confirmationSteps.map((stepLabel, index) => {
                    const done = confirmationStage === 'complete' || confirmationStep > index + 1;
                    const active = !done && (confirmationStep === index + 1 || (confirmationStep === 0 && index === 0));
                    return (
                      <div key={stepLabel} className={`insurance-auth-step${active ? ' active' : done ? ' done' : ''}`}>
                        <span className="insurance-auth-dot">{done ? '✓' : index + 1}</span>
                        <span>{stepLabel}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            ) : (
              <div className="coverage-summary">
                <div className="coverage-banner">
                  <div className="insurance-auth-mark">✓</div>
                  <div>
                    <strong>You're all set!</strong>
                    <span>To {confirmationEmail} · Reference {confirmationReference}</span>
                  </div>
                </div>
                <div className="handoff-summary-grid">
                  <div className="handoff-summary-item">
                    <div className="k">Appointment</div>
                    <div className="v">{selectedAppointment.time}</div>
                  </div>
                  <div className="handoff-summary-item">
                    <div className="k">Paperwork</div>
                    <div className="v">{dynamicFormPacket.length} dynamic form{dynamicFormPacket.length !== 1 ? 's' : ''} assigned</div>
                  </div>
                  <div className="handoff-summary-item">
                    <div className="k">Provider copied</div>
                    <div className="v">{providerCopyTarget}</div>
                  </div>
                  <div className="handoff-summary-item">
                    <div className="k">Status</div>
                    <div className="v">{assignmentStatus}</div>
                  </div>
                  <div className="handoff-summary-item">
                    <div className="k">Care team ready</div>
                    <div className="v">Complete</div>
                  </div>
                  <div className="handoff-summary-item">
                    <div className="k">Location</div>
                    <div className="v">{selectedAppointment.location}</div>
                  </div>
                </div>
                <div className="handoff-owner-banner">
                  <div className="insurance-auth-mark">✓</div>
                  <div>
                    <strong>You're all set — appointment confirmed!</strong>
                    <span>{providerCopyTarget} has been notified and will handle the provider-side next steps.</span>
                  </div>
                </div>
                {renderDynamicFormsPacket()}
                <div className="signup-panel">
                  <h3>Save your spot &amp; stay connected</h3>
                  <p>
                    Create a free account to get appointment reminders, access your care summary, and keep everything in one place.
                  </p>
                  <div className="signup-profile-grid">
                    {signupProfile.map(([key, value]) => (
                      <div className="signup-profile-item" key={key}>
                        <div className="k">{key}</div>
                        <div className="v">{value}</div>
                      </div>
                    ))}
                  </div>
                  <div className="google-signin-wrap">
                    <div ref={googleButtonRef} className="google-signin-slot" aria-label="Sign up with Google" />
                    {googleIdentityState === 'needs-client-id' && (
                      <div className="sso-config-note">
                        Google sign-in will be available shortly.
                      </div>
                    )}
                    {googleIdentityState === 'unavailable' && (
                      <div className="sso-config-note">{googleIdentityDetail}</div>
                    )}
                    {(googleIdentityState === 'needs-client-id' || googleIdentityState === 'unavailable') && (
                      <button type="button" className="sso-btn sso-google" onClick={() => handleConfiguredSso('Google')}>
                        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Continue with Google
                      </button>
                    )}
                  </div>
                  <div className="sso-options">
                    <button type="button" className="sso-btn sso-apple" onClick={() => handleConfiguredSso('Apple')}>
                      <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="white">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                      </svg>
                      Continue with Apple
                    </button>
                    <button type="button" className="sso-btn sso-microsoft" onClick={() => handleConfiguredSso('Microsoft')}>
                      <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="1" width="10.5" height="10.5" fill="#F25022"/>
                        <rect x="12.5" y="1" width="10.5" height="10.5" fill="#7FBA00"/>
                        <rect x="1" y="12.5" width="10.5" height="10.5" fill="#00A4EF"/>
                        <rect x="12.5" y="12.5" width="10.5" height="10.5" fill="#FFB900"/>
                      </svg>
                      Continue with Microsoft
                    </button>
                  </div>
                  {signupMethod && (
                    <div className="signup-success">
                      {signupStatus === 'complete'
                        ? <img className="profile-photo signup-profile-photo" src={getMockPatientAvatar(basicInfo.gender)} alt={`${resolvedName || 'Patient'} profile`} />
                        : <div className="insurance-auth-mark">✓</div>}
                      <div>
                        <strong>{signupStatus === 'needs-config' ? `${signupMethod} sign-in isn't connected yet — the team will follow up.` : `You're signing in with ${signupMethod}.`}</strong>
                        <span>{signupStatus === 'needs-config' ? signupNotice : signupNotice || 'Your intake details will be saved to your account automatically.'}</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        ) : (
          <div className="option-cards">
          <div className="privacy-saved">✓ Privacy acknowledgement saved</div>
          {matchResult?.status === 'existing' ? (
            <div className="match-result">
              <strong>Welcome back, {resolvedName}.</strong>
              Your intake will continue as a returning patient update.
            </div>
          ) : (
            <div className="match-result new">
              <strong>New patient intake started.</strong>
              Your needs assessment has been added to this intake.
            </div>
          )}
          {selectedAppointment && (
            <div className="selected-appt-summary">
              <strong>Appointment selected</strong>
              {selectedAppointment.time} with {selectedAppointment.provider.name} at {selectedAppointment.location}. Staff will confirm this time after reviewing your intake.
            </div>
          )}
          {creditCardComplete && (
            <div className="credit-saved">
              <strong>Credit card authorization saved</strong>
              Billing authorization has been added to this intake and will be reviewed by staff before confirmation.
            </div>
          )}
          <div className="match-badge">{matchResult?.status === 'existing' ? 'Existing patient' : 'New patient'}</div>
          {formMsg && (
            <div style={{
              margin: '0 0 12px',
              padding: '14px 18px',
              background: isReturning ? 'var(--teal-soft)' : 'var(--bg-tint)',
              border: `1px solid ${isReturning ? 'oklch(85% 0.05 200)' : 'var(--hair)'}`,
              borderRadius: 10,
              fontSize: 14,
              lineHeight: 1.55,
              color: 'var(--ink-2)',
            }}>
              {formMsg}
            </div>
          )}
          <p className="lede" style={{fontSize: 14, margin: '0 0 16px', color: 'var(--ink-2)'}}>
            {lede}
          </p>
          <div className="eyebrow" style={{marginBottom: 10}}>How would you like to complete your forms?</div>
          <button className="opt-card recommended" onClick={() => onChoose('ai')}>
            <div className="icon-badge"><I.sparkle /></div>
            <div className="oc-body">
              <div className="oc-title">
                Chat with our AI assistant
                <span className="oc-tag">Recommended</span>
              </div>
              <div className="oc-sub">
                {isRecent
                  ? 'Our AI will walk through your patient update form and confirm any changes to your records.'
                  : 'Answer questions in plain language. The AI fills out every form for you, explains medical terms, and you review before signing.'
                }
              </div>
              <div className="oc-meta">
                <span><I.clock /> {isRecent ? '~3 min' : '~8 min'}</span>
                <span><I.shield /> Reviewed by staff</span>
              </div>
            </div>
            <div className="oc-arrow"><I.arrow /></div>
          </button>

          <button className="opt-card" onClick={() => onChoose('docs')}>
            <div className="icon-badge" style={{background:'var(--bg-tint)',color:'var(--ink-3)'}}><I.doc /></div>
            <div className="oc-body">
              <div className="oc-title">Complete forms myself</div>
              <div className="oc-sub">
                {isRecent
                  ? 'Review your patient information form directly. Good if you have insurance or contact changes ready.'
                  : 'Fill out each document one at a time. Good if you\'ve done this before or have paperwork handy.'
                }
              </div>
              <div className="oc-meta">
                <span><I.clock /> {isRecent ? '~5 min' : '~15 min'}</span>
                <span><I.doc /> {total > 0 ? `${total} form${total !== 1 ? 's' : ''}` : '6 forms'}</span>
              </div>
            </div>
            <div className="oc-arrow"><I.arrow /></div>
          </button>

          <p className="privacy-note">
            Your information is encrypted and shared only with AlanBehrman.
            You can switch methods at any time.
          </p>
          </div>
        )}
      </div>
    </div>
  );
}

const FREQ_OPTIONS = [
  { label: "Not at all", value: 0 },
  { label: "Several days", value: 1 },
  { label: "More than half the days", value: 2 },
  { label: "Nearly every day", value: 3 },
];

function phq9Severity(score) {
  if (score <= 4)  return { label: "Minimal depression", action: "No clinical action required." };
  if (score <= 9)  return { label: "Mild depression", action: "Monitor symptoms." };
  if (score <= 14) return { label: "Moderate depression", action: "Clinical evaluation recommended." };
  if (score <= 19) return { label: "Moderately severe depression", action: "Active treatment recommended." };
  return { label: "Severe depression", action: "Immediate psychiatric evaluation." };
}

function gad7Severity(score) {
  if (score <= 4)  return { label: "Minimal anxiety", action: "No action required." };
  if (score <= 9)  return { label: "Mild anxiety", action: "Monitor symptoms." };
  if (score <= 14) return { label: "Moderate anxiety", action: "Clinical evaluation recommended." };
  return { label: "Severe anxiety", action: "Active treatment recommended." };
}

function ScoreQuestionnaire({ questions, getSeverity, label }) {
  const [answers, setAnswers] = React.useState({});
  const answered = Object.keys(answers).length;
  const total = answered === questions.length
    ? Object.values(answers).reduce((a, b) => a + b, 0)
    : null;
  const sev = total !== null ? getSeverity(total) : null;

  return (
    <div>
      {questions.map((q, i) => (
        <div key={i} className="fv-question">
          <div className="fv-q-num">{label} · Question {i + 1} of {questions.length}</div>
          <div className="fv-q-text">{q}</div>
          {i === 8 && label === 'PHQ-9' && (
            <div className="fv-q-hint">⚠ If you are having thoughts of harming yourself, please speak to a provider immediately or call 988 (Suicide & Crisis Lifeline).</div>
          )}
          <div className="fv-options">
            {FREQ_OPTIONS.map(opt => (
              <button key={opt.value} className={`fv-opt${answers[i] === opt.value ? ' sel' : ''}`}
                onClick={() => setAnswers(a => ({...a, [i]: opt.value}))}>
                <div className="fv-radio">{answers[i] === opt.value && <div className="fv-radio-fill" />}</div>
                <span>{opt.label}</span>
                <span style={{marginLeft:'auto',fontSize:12,opacity:0.5}}>{opt.value}</span>
              </button>
            ))}
          </div>
        </div>
      ))}
      {total !== null && sev && (
        <div className="fv-score-box">
          <div className="fv-score-num">{total}</div>
          <div className="fv-score-details">
            <div className="fv-score-severity">{sev.label}</div>
            <div className="fv-score-sub">{sev.action}</div>
            <div className="fv-score-sub" style={{marginTop:4}}>Score out of {questions.length * 3} — {answered}/{questions.length} questions answered</div>
          </div>
        </div>
      )}
      {total === null && answered > 0 && (
        <div style={{fontSize:12,color:'var(--ink-3)',marginTop:8}}>
          {questions.length - answered} question{questions.length - answered !== 1 ? 's' : ''} remaining
        </div>
      )}
    </div>
  );
}

const I693_STEPS = [
  {id:'personal',    title:'Personal'},
  {id:'documents',   title:'Documents'},
  {id:'id',          title:'ID'},
  {id:'interpreter', title:'Interpreter'},
  {id:'vaccination', title:'Vaccination'},

  {id:'medical',     title:'Medical Hx'},
  {id:'substance',   title:'Substance'},
  {id:'obgyn',       title:'OB/GYN'},
  {id:'medications', title:'Medications'},
  {id:'sexual',      title:'Sexual Health'},
  {id:'tb',          title:'TB Screening'},
];

function BriefI693Form() {
  const [step, setStep] = React.useState(0);
  const [data, setData] = React.useState({});
  const [done, setDone] = React.useState(new Set());

  const set = (k, v) => setData(d => ({...d, [k]: v}));
  const get = k => data[k] ?? '';
  const tog = (k, v) => setData(d => {
    const cur = d[k] || [];
    return {...d, [k]: cur.includes(v) ? cur.filter(x=>x!==v) : [...cur, v]};
  });
  const has = (k, v) => (data[k]||[]).includes(v);

  const F = ({label, k, type='text', ph, span}) => (
    <div className="fv-field" style={span===2?{gridColumn:'span 2'}:{}}>
      <label className="fv-label">{label}</label>
      <input className="fv-input" type={type} placeholder={ph||label}
        value={get(k)} onChange={e=>set(k,e.target.value)} />
    </div>
  );
  const TA = ({label, k, rows=3}) => (
    <div className="fv-field">
      <label className="fv-label">{label}</label>
      <textarea className="fv-input" rows={rows} style={{resize:'vertical'}}
        value={get(k)} onChange={e=>set(k,e.target.value)} />
    </div>
  );
  const Chips = ({label, k, opts, multi}) => (
    <div className="fv-field">
      {label && <label className="fv-label">{label}</label>}
      <div className="fv-opts-row">
        {opts.map(o => {
          const v = typeof o === 'string' ? o : o.v;
          const l = typeof o === 'string' ? o : o.l;
          const sel = multi ? has(k,v) : get(k)===v;
          return (
            <button key={v} className={`fv-chip${sel?' sel':''}`}
              onClick={() => multi ? tog(k,v) : set(k, sel?'':v)}>
              {l}
            </button>
          );
        })}
      </div>
    </div>
  );
  const YN = ({label, k, note, indent}) => (
    <div className="fv-yn-row" style={indent?{marginLeft:16}:{}}>
      <div className="fv-yn-label">{label}{note&&<small>{note}</small>}</div>
      <div className="fv-yn-btns">
        <button className={`fv-yn-btn yes${get(k)==='yes'?' sel':''}`} onClick={()=>set(k,get(k)==='yes'?'':'yes')}>Yes</button>
        <button className={`fv-yn-btn no${get(k)==='no'?' sel':''}`} onClick={()=>set(k,get(k)==='no'?'':'no')}>No</button>
      </div>

      <div style={{fontSize:24,marginBottom:6,color:'var(--ink-4)'}}>📎</div>

      {hint&&<div style={{fontSize:12,color:'var(--ink-4)',marginTop:3}}>{hint}</div>}
    </div>
  );
  const VaxRow = ({label, k, doses=1, titer}) => {
    const status = get(`${k}_status`);
    const received = status === 'vaccine' || status === 'titer';
    return (
      <div style={{marginBottom:16}}>
        <div className="fv-label">{label}</div>
        <Chips k={`${k}_status`} opts={[{v:'vaccine',l:'Received vaccine'},{v:'titer',l:'Positive titer'},{v:'no',l:'No'}]} />

          <div className={`fv-grid${doses>1?'2':'2'}`} style={{marginTop:6}}>

          <F label="Unit Number" k="unit_number" ph="#" />
        </div>
        <div className="fv-grid3">
          <F label="City" k="city" /><F label="State" k="state" /><F label="Zip" k="zip" />
        </div>
      </div>
      <div className="fv-section"><div className="fv-section-title">Contact</div>
        <div className="fv-grid2">
          <F label="Mobile Phone" k="mobile_phone" type="tel" /><F label="Home Phone" k="home_phone" type="tel" />
          <F label="Work Phone" k="work_phone" type="tel" /><F label="Email" k="email" type="email" />

    </>,
