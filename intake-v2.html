:root {
  --cream: #FAF8F4;
  --white: #FFFFFF;
  --sage: #5B8A6B;
  --sage-deep: #3D6350;
  --sage-soft: #EDF4EF;
  --ink: #1A1815;
  --ink-2: #4A453F;
  --ink-3: #8A837A;
  --border: #E8E3DC;
  --border-strong: #C9C2B8;
  --amber: #D4860F;
  --shadow: 0 2px 12px rgba(26,24,21,.06), 0 0 0 1px rgba(26,24,21,.04);
  --shadow-lg: 0 12px 40px rgba(26,24,21,.10), 0 2px 8px rgba(26,24,21,.05);
  --radius: 16px;
  --radius-sm: 10px;
  --f-display: 'Fraunces', Georgia, serif;
  --f-ui: 'Plus Jakarta Sans', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--f-ui); background: var(--cream); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
a { color: var(--sage-deep); }
button { font-family: var(--f-ui); }

/* Progress */
.prog-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--sage); transition: width 0.5s cubic-bezier(.4,0,.2,1); z-index: 200; }

/* Header */
.v2-header {
  position: fixed; top: 0; left: 0; right: 0; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; z-index: 100;
  background: rgba(250,248,244,.88); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(232,227,220,.6);
}
.v2-header .brand { display: flex; align-items: center; gap: 10px; }
.v2-header .brand img { height: 32px; width: auto; object-fit: contain; }
.v2-header .brand span { font-size: 12.5px; color: var(--ink-3); font-weight: 500; letter-spacing: .02em; }
.v2-header .hdr-right { font-size: 11.5px; color: var(--ink-3); font-weight: 500; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
.hdr-lock { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; background: var(--sage-soft); border-radius: 999px; color: var(--sage-deep); font-size: 11px; font-weight: 600; }

/* Layout */
.v2-main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 20px 60px; }

/* Card */
.v2-card {
  width: 100%; max-width: 500px;
  background: var(--white); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 44px 48px 36px;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(.985); }
  to   { opacity: 1; transform: translateY(0)   scale(1); }
}
.v2-card { animation: cardIn .38s cubic-bezier(.22,1,.36,1) both; }

/* Typography */
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .13em; color: var(--sage); font-weight: 700; margin-bottom: 12px; }
.card-title { font-family: var(--f-display); font-size: 30px; font-weight: 400; line-height: 1.12; color: var(--ink); margin-bottom: 8px; }
.card-title em { font-style: italic; color: var(--sage); }
.card-sub { font-size: 14px; color: var(--ink-3); line-height: 1.6; margin-bottom: 28px; }

/* Fields */
.f-group { display: flex; flex-direction: column; gap: 20px; margin-bottom: 28px; }
.f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.f-item { display: flex; flex-direction: column; gap: 6px; }
.f-item label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.f-item input, .f-item textarea, .f-item select {
  font-family: var(--f-ui); font-size: 15.5px; color: var(--ink);
  border: none; border-bottom: 1.5px solid var(--border); background: transparent;
  padding: 8px 0; outline: none; width: 100%; transition: border-color .15s;
  -webkit-appearance: none;
}
.f-item input:focus, .f-item textarea:focus { border-bottom-color: var(--sage); }
.f-item input::placeholder, .f-item textarea::placeholder { color: var(--ink-3); opacity: .7; }
.f-item textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
.f-item.full { grid-column: 1 / -1; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.chip {
  padding: 7px 16px; border-radius: 999px; border: 1.5px solid var(--border);
  background: var(--white); color: var(--ink-2); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .14s; user-select: none;
}
.chip:hover { border-color: var(--sage); color: var(--sage-deep); }
.chip.on { background: var(--sage-soft); border-color: var(--sage); color: var(--sage-deep); font-weight: 600; }

/* Nav */
.v2-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); }
.v2-nav.end { justify-content: flex-end; }
.btn-back { background: none; border: none; color: var(--ink-3); font-size: 13.5px; font-weight: 500; cursor: pointer; padding: 8px 0; display: flex; align-items: center; gap: 5px; transition: color .12s; }
.btn-back:hover { color: var(--ink); }
.btn-skip { background: none; border: none; color: var(--ink-3); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: underline; padding: 8px 0; }
.btn-next {
  background: var(--sage); color: white; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 600; padding: 13px 26px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: background .14s, transform .12s, opacity .12s;
}
.btn-next:hover:not(:disabled) { background: var(--sage-deep); transform: translateY(-1px); }
.btn-next:disabled { opacity: .38; cursor: not-allowed; transform: none; }
.btn-next.full { width: 100%; justify-content: center; font-size: 15px; padding: 15px; }

/* Location cards */
.loc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
.loc-card {
  border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px 14px 12px;
  cursor: pointer; background: var(--white); text-align: left; transition: all .15s;
}
.loc-card:hover { border-color: var(--sage); box-shadow: 0 2px 10px rgba(91,138,107,.14); }
.loc-card.on { border-color: var(--sage); background: var(--sage-soft); }
.loc-name { font-size: 14.5px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.loc-addr { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
.loc-badge { display: inline-block; margin-top: 8px; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sage-soft); color: var(--sage); letter-spacing: .04em; }
.loc-card.on .loc-badge { background: var(--sage); color: white; }

/* HIPAA ack */
.hipaa-ack {
  display: flex; align-items: flex-start; gap: 11px; padding: 14px;
  background: var(--sage-soft); border-radius: var(--radius-sm); margin-bottom: 28px;
}
.hipaa-ack input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--sage); margin-top: 2px; flex-shrink: 0; cursor: pointer; }
.hipaa-ack label { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; cursor: pointer; }

/* Appointment cards */
.appt-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 340px; overflow-y: auto; }
.appt-card {
  border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px;
  cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: var(--white); transition: all .15s; text-align: left; width: 100%;
}
.appt-card:hover { border-color: var(--sage); box-shadow: 0 2px 8px rgba(91,138,107,.12); }
.appt-card.on { border-color: var(--sage); background: var(--sage-soft); }
.appt-time { font-size: 15px; font-weight: 700; color: var(--ink); }
.appt-meta { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.appt-provider { font-size: 12.5px; font-weight: 600; color: var(--ink-2); text-align: right; flex-shrink: 0; }
.appt-provider small { display: block; color: var(--ink-3); font-weight: 400; font-size: 11.5px; margin-top: 2px; }

/* Credit card */
.cc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.cc-grid .full { grid-column: 1 / -1; }
.auth-check { display: flex; align-items: flex-start; gap: 10px; margin: 14px 0 4px; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.auth-check input { accent-color: var(--sage); flex-shrink: 0; margin-top: 2px; cursor: pointer; }
.auth-check small { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 3px; }
.appt-reminder { background: var(--cream); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 18px; font-size: 13px; color: var(--ink-2); }

/* Matching / sending spinner */
.spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 12px 0 8px; }
.spin-ring { width: 56px; height: 56px; border-radius: 50%; border: 2.5px solid var(--sage); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin-steps { display: flex; flex-direction: column; gap: 11px; width: 100%; max-width: 320px; }
.spin-step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); transition: color .3s; }
.spin-step.done { color: var(--ink-2); }
.spin-step.active { color: var(--ink); font-weight: 600; }
.spin-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background .3s; }
.spin-step.done .spin-dot { background: var(--sage); }
.spin-step.active .spin-dot { background: var(--sage); animation: dotPulse .7s ease infinite alternate; }

.sso-success { padding: 12px 14px; background: var(--sage-soft); border-radius: var(--radius-sm); border: 1px solid var(--sage); font-size: 13px; color: var(--ink-2); display: flex; gap: 10px; align-items: flex-start; }

/* Responsive */
@media (max-width:600px) {
  .v2-card { padding: 30px 22px 26px; }
  .card-title { font-size: 26px; }
  .loc-grid, .cc-grid, .f-row { grid-template-columns: 1fr; }
  .cc-grid .full { grid-column: 1; }
  .v2-header { padding: 0 18px; }
  .v2-header .brand span { display: none; }
}
